name: pages

# Publish the committed site/ folder: on a human push that changes it, and after every
# ladder run (the ladder commits site/ with the Actions token, and GitHub does not start
# push-triggered workflows for such commits, so the ladder's completion is the trigger).
# Needs neither the engine nor any secret.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: [ladder]
    types: [completed]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
