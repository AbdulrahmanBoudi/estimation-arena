name: ladder

# The leaderboard run: every new or changed bot plays the anchors it has not met, in duplicate
# sets. Results and the rebuilt site/ are committed when they changed; pages.yml runs when this
# workflow completes and publishes site/ to GitHub Pages. Model files come from Hugging Face
# (models.lock.json). An anchor whose files are not there yet is left out.

on:
  schedule:
    - cron: "0 3 * * *"   # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      sets:
        description: duplicate sets per anchor
        default: "20"
      bots:
        description: space-separated bot names (empty = all)
        default: ""
      replay:
        description: replay games these bots already played
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ladder
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Allow uv to clone the private engine repo
        run: git config --global url."https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: uv sync --frozen
      - run: uv run python -m arena.models fetch
      - name: Play every bot against the anchors
        env:
          # The leaderboard seed is a secret so nobody can tune to the exact deals it uses.
          # --hide-seed keeps it out of the public results and the page.
          LADDER_SEED: ${{ secrets.LADDER_SEED }}
        run: |
          sets="${{ github.event.inputs.sets || '20' }}"
          bots="${{ github.event.inputs.bots }}"
          [ -n "$bots" ] || bots=$(ls bots)
          only_new="--only-new"
          [ "${{ github.event.inputs.replay }}" != "true" ] || only_new=""
          for bot in $bots; do
            uv run python -m arena.run --bot "$bot" --sets "$sets" --seed "${LADDER_SEED:-0}" --workers 4 --progress --hide-seed $only_new
          done
      - name: Commit results and site
        run: |
          if git diff --quiet -- results && [ -z "$(git ls-files --others --exclude-standard results)" ]; then
            echo "no new games"
            exit 0
          fi
          uv run python -m arena.leaderboard
          git config user.name "estimation-arena bot"
          git config user.email "actions@users.noreply.github.com"
          git add results site
          git diff --cached --quiet || git commit -m "ladder: $(date -u +%F) run"
          git push
